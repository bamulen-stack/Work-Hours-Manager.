'use strict';const KEY='work_hours_manager_standalone_v1';let db={workers:[],entries:[]};try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&Array.isArray(raw.workers)&&Array.isArray(raw.entries))db=raw}catch(e){}let selected='',month=localDate().slice(0,7),reportMode='month',reportDate=localDate(),editing=null,periods=[];function localDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function duration(min){min=Math.max(0,Math.round(min||0));return Math.floor(min/60)+'h '+String(min%60).padStart(2,'0')+'m'}function mins(x){if(x.minutes!==undefined&&x.minutes!==null)return Math.max(0,Math.round(Number(x.minutes)||0));if(x.hours!==undefined&&x.hours!==null&&x.hours!=='')return Math.round(Number(x.hours)*60)||0;let a=(x.start||'').split(':').map(Number),b=(x.end||'').split(':').map(Number);if(a.length<2||b.length<2)return 0;let n=b[0]*60+b[1]-a[0]*60-a[1];return n<0?n+1440:n}function uid(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function entriesFor(worker,date){return db.entries.filter(x=>x.worker===worker&&x.date===date).sort((a,b)=>a.start.localeCompare(b.start))}function dailyMinutes(worker,date){return entriesFor(worker,date).reduce((s,x)=>s+mins(x),0)}function overtime(worker,date){const rows=entriesFor(worker,date);const manual=rows.find(x=>x.overtimeOverride!==undefined&&x.overtimeOverride!==null&&x.overtimeOverride!=='');return manual?Math.max(0,Math.round(Number(manual.overtimeOverride)*60)):Math.max(0,dailyMinutes(worker,date)-510)}function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function easter(y sc(x.end)} ${esc(x.property||'')}`).join(' · ')}</div><div class="muted">Υπερωρίες ${duration(overtime(w,d))} • Πατήστε για επεξεργασία</div></div>`).join('')||'<div class="muted">Δεν υπάρχουν ώρες αυτόν τον μήνα.</div>'}`:''}</div>`}if(!db.workers.length)html+='<div class="card muted">Προσθέστε πρώτα έναν εργαζόμενο.</div>';document.getElementById('home').innerHTML=html}function toggleWorker(n){selected=selected===n?'':n;renderHome()}function editDay(worker,date){editing={worker,date};const rows=entriesFor(worker,date);periods=rows.length?rows.map(x=>({start:x.start,end:x.end,property:x.property||'',notes:x.notes||''})):[{start:'08:30',end:'17:00',property:'',notes:''}];document.getElementById('editor').innerHTML=`<h2>Ωράριο • ${esc(worker)}</h2><label>Ημερομηνία</label><input type="date" id="edDate" value="${date}"><div id="periods"></div><button class="alt" onclick="capturePeriods();periods.push({start:'',end:'',property:'',notes:''});drawPeriods()">+ Διάστημα εργασίας</button><label>Χειροκίνητη υπερωρία (ώρες και λεπτά, προαιρετικό)</label><div class="grid"><input type="number" min="0" step="1" id="otH" placeholder="Ώρες"><input type="number" min="0" max="59" step="1" id="otM" placeholder="Λεπτά"></div><div class="muted">Κενό = αυτόματος υπολογισμός μετά τις 8h 30m.</div><div class="row" style="margin-top:18px"><button onclick="saveDay()">Αποθήκευση</button><button class="alt" onclick="view('home')">Άκυρο</button>${rows.length?'<button class="danger" onclick="deleteDay()">Διαγραφή ημέρας</button>':''}</div>`;const ov=rows.find(x=>x.overtimeOverride!==undefined&&x.overtimeOverride!==null&&x.overtimeOverride!=='');if(ov){const m=Math.round(Number(ov.overtimeOverride)*60);document.getElementById('otH').value=Math.floor(m/60);document.getElementById('otM').value=m%60}drawPeriods();view('editor')}function drawPeriods(){document.getElementById('periods').innerHTML=periods.map((p,i)=>`<div class="period"><div class="row spread"><span class="period-title">Διάστημα ${i+1}</span><button class="danger tiny" onclick="capturePeriods();periods.splice(${i},1);drawPeriods()">Αφαίρεση</button></div><div class="grid"><div><label>Από</label><input type="time" data-i="${i}" data-k="start" value="${esc(p.start)}"></div><div><label>Έως</label><input type="time" data-i="${i}" data-k="end" value="${esc(p.end)}"></div></div><label>Κτίριο / εργασία</label><input data-i="${i}" data-k="property" value="${esc(p.property)}" placeholder="π.χ. Office"><label>Σημειώσεις</label><input data-i="${i}" data-k="notes" value="${esc(p.notes)}"></div>`).join('')}function capturePeriods(){document.querySelectorAll('#periods [data-i]').forEach(el=>{const i=+el.dataset.i;if(periods[i])periods[i][el.dataset.k]=el.value})}function saveDay(){capturePeriods();const date=document.getElementById('edDate').value,worker=editing.worker;if(!date||!periods.length){alert('Συμπληρώστε ημερομηνία και τουλάχιστον ένα διάστημα');return}let intervals=[];for(const p of periods){if(!/^\d\d:\d\d$/.test(p.start)||!/^\d\d:\d\d$/.test(p.end)){alert('Συμπληρώστε τις ώρες');return}const a=+p.start.slice(0,2)*60+(+p.start.slice(3)),b=+p.end.slice(0,2)*60+(+p.end.slice(3));if(b<=a){alert('Η ώρα λήξης πρέπει να είναι μετά την έναρξη');return}intervals.push([a,b])}intervals.sort((a,b)=>a[0]-b[0]);if(intervals.some((x,i)=>i>0&&x[0]<intervals[i-1][1])){alert('Τα διαστήματα επικαλύπτονται');return}if(date!==editing.date&&entriesFor(worker,date).length&&!confirm('Υπάρχουν ώρες στη νέα ημερομηνία. Να αντικατασταθούν;'))return;const oh=document.getElementById('otH').value,om=document.getElementById('otM').value;let override=null;if(oh!==''||om!==''){const h=+(oh||0),m=+(om||0);if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||m<0||m>59){alert('Μη έγκυρες υπερωρίες');return}override=(h*60+m)/60}db.entries=db.entries.filter(x=>!(x.worker===worker&&(x.date===editing.date||x.date===date)));periods.forEach((p,i)=>db.entries.push({id:uid(),worker,date,start:p.start,end:p.end,property:p.property.trim(),not function reportRange(){if(reportMode==='month'){let m=reportDate.slice(0,7),[y,n]=m.split('-').map(Number);return [m+'-01',`${y}-${String(n).padStart(2,'0')}-${String(new Date(y,n,0).getDate()).padStart(2,'0')}`]}let d=new Date(reportDate+'T12:00:00'),dow=(d.getDay()+6)%7;return [addDays(reportDate,-dow),addDays(reportDate,6-dow)]}function changeReport(n){let d=new Date(reportDate+'T12:00:00');if(reportMode==='month')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+7*n);reportDate=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');renderReport()}function reportData(){let [start,end]=reportRange();const rows=db.entries.filter(x=>x.date>=start&&x.date<=end).sort((a,b)=>a.worker.localeCompare(b.worker,'el')||a.date.localeCompare(b.date)||a.start.localeCompare(b.start));let by={};for(const x of rows){if(!by[x.worker])by[x.worker]={rows:[],dates:new Set(),total:0,ot:0,types:{weekday:0,saturday:0,sunday:0,holiday:0}};let b=by[x.worker];b.rows.push(x);b.dates.add(x.date);b.total+=mins(x);b.types[kind(x.date)]+=mins(x)}for(const [w,b] of Object.entries(by))for(const d of b.dates)b.ot+=overtime(w,d);return {start,end,rows,by}}function renderReport(){const r=reportData();let h=`<h2>Αναφορές</h2><div class="row"><button class="${reportMode==='week'?'':'alt'}" onclick="reportMode='week';renderReport()">Εβδομάδα</button><button class="${reportMode==='month'?'':'alt'}" onclick="reportMode='month';renderReport()">Μήνας</button><button class="alt tiny" onclick="changeReport(-1)">◀</button><button class="alt tiny" onclick="changeReport(1)">▶</button></div><div class="card"><b>${fmtDate(r.start)} – ${fmtDate(r.end)}</b><div class="muted">${Object.keys(r.by).length} εργαζόμενοι • ${r.rows.length} διαστήματα</div><div class="row" style="margin-top:12px"><button onclick="downloadPDF()">⬇ Αποθήκευση PDF</button></div></div>`;for(const [w,b] of Object.entries(r.by)){h+=`<div class="card"><div class="name">${esc(w)}</div><div class="row spread"><b>Σύνολο ${duration(b.total)}</b><b>Υπερωρίες ${duration(b.ot)}</b></div><div class="line"></div>${Object.keys(kinds).map(k=>`<div class="row spread"><span>${kinds[k]}</span><b>${duration(b.types[k])}</b></div>`).join('')}<div class="line"></div>${b.rows.map(x=>`<div class="entry"><b>${fmtDate(x.date)} ${esc(x.start)}–${esc(x.end)} • ${duration(mins(x))}</b><div class="muted">${esc(x.property||'')} ${esc(x.notes||'')}</div></div>`).join('')}</div>`}if(!r.rows.length)h+='<div class="card muted">Δεν υπάρχουν καταχωρίσεις για την περίοδο.</div>';document.getElementById('report').innerHTML=h}

function pdfBlob(canvases){let parts=[],offsets=[0],len=0;function put(s){const b=new TextEncoder().encode(s);parts.push(b);len+=b.length}function bytes(b){parts.push(b);len+=b.length}function obj(n,body){offsets[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n')}put('%PDF-1.4\n');let imgs=canvases.map(c=>{let raw=atob(c.toDataURL('image/jpeg',.84).split(',')[1]),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a});const count=canvases.length;obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Count ${count} /Kids [${canvases.map((_,i)=>3+i*3+' 0 R').join(' ')}] >>`);canvases.forEach((c,i)=>{let p=3+i*3,img=p+1,cont=p+2;obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${i} ${img} 0 R >> >> /Contents ${cont} 0 R >>`);offsets[img]=len;put(`${img} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgs[i].length} >>\nstream\n`);bytes(imgs[i]);put('\nendstream\nendobj\n');let s=`q 595 0 0 842 0 0 cm /Im${i} Do Q`;obj(cont,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`) });let start=len;put('xref\n0 '+(3+count*3)+'\n0000000000 65535 f \n');for(let i=1;i<3+count*3;i++)put(String(offsets[i]).padStart(10,'0')+' 00000 n \n');put(`trailer\n<< /Size ${3+count*3} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
function downloadPDF(){const r=reportData(),W=1190,H=1684,margin=72;let pages=[],c,ctx,y;function newPage(){c=document.createElement('canvas');c.width=W;c.height=H;ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#14233b';ctx.font='bold 35px system-ui';ctx.fillText('WORK HOURS MANAGER',margin,90);ctx.font='24px system-ui';ctx.fillText(`${fmtDate(r.start)} – ${fmtDate(r.end)}`,margin,135);ctx.strokeStyle='#d4deeb';ctx.beginPath();ctx.moveTo(margin,158);ctx.lineTo(W-margin,158);ctx.stroke();y=205;pages.push(c)}function line(text,style='normal'){if(y>H-105)newPage();ctx.fillStyle=style==='head'?'#173a66':'#24384e';ctx.font=style==='head'?'bold 28px system-ui':style==='bold'?'bold 23px system-ui':'22px system-ui';let txt=String(text);while(ctx.measureText(txt).width>W-2*margin&&txt.length>1)txt=txt.slice(0,-2)+'…';ctx.fillText(txt,margin,y);y+=style==='head'?48:36}newPage();for(const [w,b] of Object.entries(r.by)){if(y>H-500)newPage();line(w,'head');line(`Σύνολο: ${duration(b.total)}     Υπερωρίες: ${duration(b.ot)}`,'bold');for(const k of Object.keys(kinds))line(`${kinds[k]}: ${duration(b.types[k])}`);y+=8;let last='';for(const x of b.rows){if(x.date!==last){last=x.date;line(`${fmtDate(last)}  •  ${holiday(last)||kinds[kind(last)]}  •  ${duration(dailyMinutes(w,last))}`,'bold')}line(`    ${x.start}–${x.end}  ${duration(mins(x))}   ${x.property||''}`);if(x.notes)line('    '+x.notes)}y+=35}if(!r.rows.length)line('Δεν υπάρχουν καταχωρίσεις.');pages.forEach((page,i)=>{let x=page.getContext('2d');x.fillStyle='#65758a';x.font='19px system-ui';x.fillText(`Σελίδα ${i+1}/${pages.length} • Εσωτερική καταγραφή χρόνου`,margin,H-42)});const blob=pdfBlob(pages),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Work_Hours_${r.start}_${r.end}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function renderSettings(){document.getElementById('settings').innerHTML=`<h2>Αντίγραφα ασφαλείας</h2><div class="card"><p>Τα δεδομένα αποθηκεύονται <b>μόνο σε αυτή τη συσκευή και σε αυτόν τον browser</b>. Δεν συγχρονίζονται.</p><button onclick="backup()">⬇ Backup JSON</button><label>Επαναφορά από αρχείο backup</label><input type="file" accept=".json,application/json" onchange="restore(this)"><p class="notice">Η επαναφορά αντικαθιστά τα τρέχοντα δεδομένα. Κρατήστε τακτικά backup, ειδικά πριν από αλλαγή συσκευής ή εκκαθάριση browser.</p></div><div class="card"><b>Προεπιλεγμένο όριο υπερωριών: 8h 30m</b><p class="muted">Πανελλαδικές ελληνικές αργίες, χωρίς τοπικές/κλαδικές εξαιρέσεις. Η υπερωρία εδώ είναι εσωτερική καταγραφή και όχι νομικός χαρακτηρισμός μισθοδοσίας.</p></div>`}function backup(){const b=new Blob([JSON.stringify({format:'work-hours-manager-v1',savedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Work_Hours_Backup_'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}async function restore(input){const f=input.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.workers)||!Array.isArray(o.entries))throw Error('Μη έγκυρο backup');if(!confirm('Αντικατάσταση όλων των τρεχόντων δεδομένων;'))return;db={workers:o.workers.filter(x=>typeof x==='string'),entries:o.entries.filter(x=>x&&typeof x.worker==='string'&&/^\d{4}-\d\d-\d\d$/.test(x.date||'')&&typeof x.start==='string'&&typeof x.end==='string')};persist();selected='';alert('Η επαναφορά ολοκληρώθηκε');view('home')}catch(e){alert('Αποτυχία επαναφοράς: '+e.message)}finally{input.value=''}}view('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
